<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auckland Mapping</title>
  <meta name="description" content="Interactive map of where major companies are located in central Auckland.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="panel" class="panel">
    <header class="panel-head">
      <button id="panel-toggle" class="panel-toggle" aria-label="Toggle company list" aria-expanded="true">
        <span class="grip"></span>
      </button>
      <h1>Auckland Mapping</h1>
      <p class="sub"><span id="count">0</span> companies in central Auckland</p>
      <p id="jobs-updated" class="updated" hidden></p>
      <input id="search" type="search" placeholder="Search companies…" autocomplete="off">
      <div id="filters" class="filters" role="group" aria-label="Filter by category"></div>
      <div class="list-tools">
        <span id="on-map"></span>
        <button id="show-all" type="button">Show all</button>
        <button id="hide-all" type="button">Hide all</button>
      </div>
    </header>
    <ul id="list" class="list"></ul>
  </aside>

  <!-- Open roles for the selected company (slides out beside the sidebar) -->
  <aside id="roles-panel" class="roles-panel" aria-label="Open roles" hidden>
    <header class="rp-head">
      <img id="rp-logo" src="" alt="">
      <div class="rp-title">
        <h2 id="rp-name"></h2>
        <p id="rp-sub"></p>
      </div>
      <button id="rp-close" class="rp-close" type="button" aria-label="Close roles list">&times;</button>
    </header>
    <ul id="rp-list" class="rp-list"></ul>
    <footer class="rp-foot">
      <a id="rp-careers" href="#" target="_blank" rel="noopener">View all on careers site &rarr;</a>
    </footer>
  </aside>

  <main id="map" aria-label="Map of Auckland"></main>
  <button id="reset" class="reset" title="Back to Auckland CBD">Reset view</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="data/companies.js"></script>
  <script src="data/jobs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
